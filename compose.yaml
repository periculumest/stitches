services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: stitch_helper
      POSTGRES_USER: stitch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - stitch-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stitch -d stitch_helper"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  stitch-postgres:
